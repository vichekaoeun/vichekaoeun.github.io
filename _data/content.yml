home_intro: I’m Vic, a computer science student and software engineer. This is where I keep field notes from things I build, learn, read, and watch.
home_note: I’m interested in reliable software, developer tools, security, and the small design choices that make technology feel humane. I also write about whatever else has my attention.
about_heading: I like making complicated systems feel a little less complicated.
about_intro: I’m a computer science student and software engineer. My interests sit where systems engineering, reliability, security, and developer experience overlap.
about_work: In summer 2026, I’m joining IBM’s Maximo team as a Site Reliability Engineering intern. Before that, I spent a year at SOTI working on enterprise VPN software—shipping multi-server, per-app, split-tunnel, and network-aware features.
about_personal: Away from work, I read a lot, watch films, and disappear into long JRPGs. This site is a record of both sides—what I’m building and what I’m noticing.
