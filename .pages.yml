media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Short description
        type: text
        description: Shown on the home page and writing archive.
      - name: date
        label: Publish date
        type: date
      - name: category
        label: Category
        type: string
      - name: image
        label: Cover image
        type: image
        required: false
      - name: image_alt
        label: Cover image description
        type: string
        required: false
      - name: image_caption
        label: Cover image caption
        type: string
        required: false
      - name: body
        label: Post
        type: rich-text

  - name: projects
    label: Projects
    type: collection
    path: _projects
    filename: "{primary}.md"
    view:
      fields: [title, stack, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project name
        type: string
      - name: order
        label: Display order
        type: number
      - name: stack
        label: Technologies
        type: string
      - name: description
        label: Short description
        type: text
        description: Shown on the project list and detail page.
      - name: repository
        label: Repository URL
        type: string
      - name: demo
        label: Demo URL
        type: string
        required: false
      - name: body
        label: Project details
        type: rich-text

  - name: open_source
    label: Open source
    type: collection
    path: _open_source
    filename: "{primary}.md"
    view:
      fields: [title, date, role, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Project name
        type: string
      - name: order
        label: Display order
        type: number
      - name: date
        label: Contribution date
        type: date
      - name: role
        label: Your role
        type: string
      - name: description
        label: Short description
        type: text
      - name: repository
        label: Repository URL
        type: string
        required: false
      - name: contribution
        label: Your PR, issue, or commits URL
        type: string
        required: false
        description: Link directly to your work in this project. GitHub does not offer a contribution graph filtered to one repository.
      - name: body
        label: Contribution post
        type: rich-text

  - name: about_page
    label: About page
    type: file
    path: _data/about.yml
    fields:
      - name: heading
        label: Heading
        type: text
      - name: intro
        label: Introduction
        type: text
      - name: personal
        label: Personal note
        type: text
      - name: github
        label: GitHub URL
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string

  - name: work_history
    label: Work history
    type: collection
    path: _work_history
    filename: "{primary}.md"
    view:
      fields: [company, role, period, order]
      primary: company
      sort: [order, company]
      default:
        sort: order
        order: asc
    fields:
      - name: company
        label: Company
        type: string
      - name: company_url
        label: Company URL
        type: string
        required: false
      - name: period
        label: Date range
        type: string
        description: For example, May 2026 – Present.
      - name: role
        label: Role
        type: string
      - name: description
        label: Description
        type: text
      - name: order
        label: Display order
        type: number
