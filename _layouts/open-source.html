---
layout: default
---
<article class="project-detail">
  <header class="project-detail-header">
    <a class="back-link" href="{{ '/open-source/' | relative_url }}">← All open source</a>
    <p class="eyebrow">{{ page.role }}</p>
    <h1>{{ page.title }}</h1>
    <p class="project-summary">{{ page.description }}</p>
    <div class="project-actions">
      {% if page.repository %}<a href="{{ page.repository }}">View repository ↗</a>{% endif %}
      {% if page.contribution %}<a href="{{ page.contribution }}">View contribution ↗</a>{% endif %}
    </div>
  </header>
  <div class="prose">{{ content }}</div>
</article>
