---
layout: default
---
<article class="project-detail">
  <header class="project-detail-header">
    <a class="back-link" href="{{ '/projects/' | relative_url }}">← All projects</a>
    <p class="eyebrow">{{ page.stack }}</p>
    <h1>{{ page.title }}</h1>
    <p class="project-summary">{{ page.description }}</p>
    <div class="project-actions">
      <a href="{{ page.repository }}">View repository ↗</a>
      {% if page.demo %}<a href="{{ page.demo }}">Live demo ↗</a>{% endif %}
    </div>
  </header>
  <div class="prose">{{ content }}</div>
</article>
